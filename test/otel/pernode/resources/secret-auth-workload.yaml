# Secret-referencing monitor E2E fixture (otelPrometheusMonitor.readSecrets).
# auth-app serves its metrics only behind HTTP basic auth: nginx on port 8081 checks
# the credentials and proxies to the example app on 127.0.0.1:8080. The ServiceMonitor
# reads the username and password from the auth-app-basic-auth Secret, so the Target
# Allocator can build a working scrape config only if it may read that Secret.
# TestServiceMonitorBasicAuthFromSecret checks the scrape config and the metrics.
#
# The credentials are test-only values. Applied by terraform/eks/daemon/otel-pernode.
---
apiVersion: v1
kind: Namespace
metadata:
  name: secret-auth-e2e
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-app-basic-auth
  namespace: secret-auth-e2e
type: Opaque
stringData:
  username: e2e-scraper
  password: e2e-scrape-pass
---
# htpasswd entry for e2e-scraper / e2e-scrape-pass (openssl passwd -apr1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-app-nginx
  namespace: secret-auth-e2e
data:
  htpasswd: |
    e2e-scraper:$apr1$e2esalt$dfB2IKQTzwpgxZWMvOyis.
  default.conf: |
    server {
      listen 8081;
      location /metrics {
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        proxy_pass http://127.0.0.1:8080/metrics;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-app
  namespace: secret-auth-e2e
  labels: { app: auth-app }
spec:
  replicas: 1
  selector:
    matchLabels: { app: auth-app }
  template:
    metadata:
      labels: { app: auth-app }
    spec:
      containers:
        - name: app
          image: quay.io/brancz/prometheus-example-app:v0.5.0
          args: ["--bind=127.0.0.1:8080"]
        - name: auth-proxy
          image: public.ecr.aws/nginx/nginx:1.27-alpine
          ports:
            - { name: metrics-auth, containerPort: 8081 }
          volumeMounts:
            - { name: nginx, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: nginx, mountPath: /etc/nginx/auth/htpasswd, subPath: htpasswd, readOnly: true }
      volumes:
        - name: nginx
          configMap: { name: auth-app-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-app
  namespace: secret-auth-e2e
  labels: { app: auth-app }
spec:
  selector: { app: auth-app }
  ports:
    - { name: metrics-auth, port: 8081, targetPort: metrics-auth }
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: auth-app
  namespace: secret-auth-e2e
  labels: { app: auth-app }
spec:
  namespaceSelector:
    matchNames: [secret-auth-e2e]
  selector:
    matchLabels: { app: auth-app }
  endpoints:
    - port: metrics-auth
      path: /metrics
      interval: 30s
      basicAuth:
        username: { name: auth-app-basic-auth, key: username }
        password: { name: auth-app-basic-auth, key: password }
      relabelings:
        - targetLabel: app
          replacement: auth-app
          action: replace
