# Lightweight KEDA/Karpenter stubs for Container Insights e2e.
#
# These are NOT the real operators. Each is an nginx pod serving a static
# Prometheus /metrics endpoint (from a ConfigMap) that emits the metric names the
# cluster-scraper's solutions pipelines expect, in the keda/karpenter namespaces
# with the app.kubernetes.io/name labels the solutions config selects on. This
# validates the scrape -> OTEL pipeline -> CloudWatch path (metric presence),
# without provisioning real KEDA/Karpenter infrastructure (IAM, provisioners, etc).
apiVersion: v1
kind: Namespace
metadata:
  name: keda
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics
  namespace: keda
data:
  metrics: |
    # TYPE keda_scaler_active gauge
    keda_scaler_active{scaledObject="demo"} 1
    # TYPE keda_scaledobject_paused gauge
    keda_scaledobject_paused{scaledObject="demo"} 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator
  namespace: keda
  labels:
    app.kubernetes.io/name: keda-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-operator
    spec:
      containers:
        - name: metrics
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          command: ["/bin/sh", "-c"]
          args:
            - |
              command -v python3 >/dev/null 2>&1 || dnf install -y python3 >/dev/null 2>&1
              exec python3 -c '
              import http.server, socketserver, socket
              body = open("/etc/metrics/metrics", "rb").read()
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *a):
                      pass
              class Server(socketserver.TCPServer):
                  address_family = socket.AF_INET6
                  def server_bind(self):
                      self.socket.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
                      super().server_bind()
              Server(("::", 80), H).serve_forever()
              '
          ports:
            - name: metrics
              containerPort: 80
          volumeMounts:
            - name: metrics
              mountPath: /etc/metrics
      volumes:
        - name: metrics
          configMap:
            name: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics
  namespace: karpenter
data:
  metrics: |
    # TYPE karpenter_nodes_total gauge
    karpenter_nodes_total{nodepool="default"} 3
    # TYPE karpenter_pods_state gauge
    karpenter_pods_state{phase="Running"} 12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter
  namespace: karpenter
  labels:
    app.kubernetes.io/name: karpenter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter
    spec:
      containers:
        - name: metrics
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          command: ["/bin/sh", "-c"]
          args:
            - |
              command -v python3 >/dev/null 2>&1 || dnf install -y python3 >/dev/null 2>&1
              exec python3 -c '
              import http.server, socketserver, socket
              body = open("/etc/metrics/metrics", "rb").read()
              class H(http.server.BaseHTTPRequestHandler):
                  def do_GET(self):
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain; version=0.0.4; charset=utf-8")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *a):
                      pass
              class Server(socketserver.TCPServer):
                  address_family = socket.AF_INET6
                  def server_bind(self):
                      self.socket.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
                      super().server_bind()
              Server(("::", 80), H).serve_forever()
              '
          ports:
            - name: http-metrics
              containerPort: 80
          volumeMounts:
            - name: metrics
              mountPath: /etc/metrics
      volumes:
        - name: metrics
          configMap:
            name: metrics
