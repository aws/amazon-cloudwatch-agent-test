# Lightweight KEDA/Karpenter stubs for Container Insights e2e.
#
# These are NOT the real operators. Each is an nginx pod serving a static
# Prometheus /metrics endpoint (from a ConfigMap) that emits the metric names the
# cluster-scraper's solutions pipelines expect, in the keda/karpenter namespaces
# with the app.kubernetes.io/name labels the solutions config selects on. This
# validates the scrape -> OTEL pipeline -> CloudWatch path (metric presence),
# without provisioning real KEDA/Karpenter infrastructure (IAM, provisioners, etc).
apiVersion: v1
kind: Namespace
metadata:
  name: keda
---
apiVersion: v1
kind: Namespace
metadata:
  name: karpenter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics
  namespace: keda
data:
  metrics: |
    # TYPE keda_scaler_active gauge
    keda_scaler_active{scaledObject="demo"} 1
    # TYPE keda_scaledobject_paused gauge
    keda_scaledobject_paused{scaledObject="demo"} 0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-operator
  namespace: keda
  labels:
    app.kubernetes.io/name: keda-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keda-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keda-operator
    spec:
      containers:
        - name: metrics
          image: nginx:alpine
          ports:
            - name: metrics
              containerPort: 80
          volumeMounts:
            - name: metrics
              mountPath: /usr/share/nginx/html/metrics
              subPath: metrics
      volumes:
        - name: metrics
          configMap:
            name: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics
  namespace: karpenter
data:
  metrics: |
    # TYPE karpenter_nodes_total gauge
    karpenter_nodes_total{nodepool="default"} 3
    # TYPE karpenter_pods_state gauge
    karpenter_pods_state{phase="Running"} 12
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: karpenter
  namespace: karpenter
  labels:
    app.kubernetes.io/name: karpenter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: karpenter
    spec:
      containers:
        - name: metrics
          image: nginx:alpine
          ports:
            - name: http-metrics
              containerPort: 80
          volumeMounts:
            - name: metrics
              mountPath: /usr/share/nginx/html/metrics
              subPath: metrics
      volumes:
        - name: metrics
          configMap:
            name: metrics
