# Minimal placeholder workload for the e2e framework's mandatory sample-app step.
# InitializeEnvironment applies this and waits for deployment/<filename> in the
# "test" namespace. Container Insights validates node/cluster metrics + logs and
# doesn't need a workload, so this is just a tiny nginx to satisfy the framework.
apiVersion: v1
kind: Namespace
metadata:
  name: test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: test
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: public.ecr.aws/amazonlinux/amazonlinux:2023
          command: ["/bin/sh", "-c"]
          args:
            - while true; do echo "$(date -u '+%Y-%m-%dT%H:%M:%SZ') sample-app log line"; sleep 5; done
