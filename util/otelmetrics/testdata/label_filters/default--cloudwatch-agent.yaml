# Rendered from aws-observability/helm-charts commit 1cc784c with:
#
#   helm template amazon-cloudwatch-observability charts/amazon-cloudwatch-observability \
#     --namespace amazon-cloudwatch -f ci.yaml
#
# ci.yaml:
#   clusterName: c
#   region: us-west-2
#   otelContainerInsights:
#     enabled: true
#     solutions:
#       karpenter: {enabled: true}
#       keda: {enabled: true}
#
# The processors section of spec.otelConfig of the AmazonCloudWatchAgent cloudwatch-agent, unchanged.
processors:
  awsattributelimit/cw_k8s_ci_v0:
    max_total_attributes: 150
    unconditional_removal_keys:
    - k8s.node.label.topology.kubernetes.io/region
    - k8s.node.label.topology.kubernetes.io/zone
    - k8s.node.label.topology.ebs.csi.aws.com/zone
    - k8s.node.label.node.kubernetes.io/instance-type
    - k8s.node.label.kubernetes.io/hostname
    - k8s.node.label.helm.sh/chart
    - k8s.node.label.release
    - k8s.node.label.eks.amazonaws.com/nodegroup-image
    - k8s.node.label.k8s.io/cloud-provider-aws
    - k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateId
    - k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateVersion
    - k8s.node.label.karpenter.sh/do-not-sync-taints
    - k8s.node.label.karpenter.sh/initialized
    - k8s.node.label.karpenter.sh/registered
    - k8s.node.label.karpenter.k8s.aws/instance-category
    - k8s.node.label.karpenter.k8s.aws/instance-family
    - k8s.node.label.karpenter.k8s.aws/instance-generation
    - k8s.node.label.karpenter.k8s.aws/instance-size
    - k8s.node.label.karpenter.k8s.aws/instance-memory
    - k8s.node.label.karpenter.k8s.aws/instance-hypervisor
    - k8s.node.label.karpenter.k8s.aws/instance-local-nvme
    - k8s.node.label.karpenter.k8s.aws/instance-ebs-bandwidth
    - k8s.node.label.karpenter.k8s.aws/instance-network-bandwidth
    - k8s.node.label.karpenter.k8s.aws/instance-encryption-in-transit-supported
    - k8s.node.label.karpenter.k8s.aws/instance-capability-flex
    - k8s.pod.label.pod-template-hash
    - k8s.pod.label.controller-revision-hash
    - k8s.pod.label.pod-template-generation
    - k8s.pod.label.topology.kubernetes.io/region
    - k8s.pod.label.topology.kubernetes.io/zone
    unconditional_removal_prefixes:
    - k8s.node.label.feature.node.kubernetes.io/
    - k8s.node.label.beta.kubernetes.io/
    - k8s.node.label.failure-domain.beta.kubernetes.io/
    - k8s.node.label.alpha.eksctl.io/
    - k8s.node.label.karpenter.k8s.aws/instance-cpu
    - k8s.node.label.karpenter.k8s.aws/instance-gpu-
    - k8s.node.label.karpenter.k8s.aws/instance-accelerator-
    - k8s.node.label.eks.amazonaws.com/instance-
  awsdevicepodcorrelation/cw_k8s_ci_v0:
    device_types:
    - device_id_attribute: neuroncore
      name: neuron-by-core
      resource_names:
      - aws.amazon.com/neuroncore
    - device_id_attribute: neurondevice
      name: neuron-by-device
      resource_names:
      - aws.amazon.com/neurondevice
      - aws.amazon.com/neuron
    - device_id_attribute: aws.efa.device
      name: efa
      resource_names:
      - vpc.amazonaws.com/efa
    dra_device_types:
    - device_id_attribute: aws.efa.device
      dra_device_id_attribute: dra.net/rdmaDevice
      driver_names:
      - dra.net
      name: efa-dra
    - device_id_attribute: neurondevice
      dra_device_id_attribute: deviceId
      driver_names:
      - neuron.aws.com
      name: neuron-dra
    node_name: ${env:K8S_NODE_NAME}
  awsneuron/cw_k8s_ci_v0: {}
  batch/cw_k8s_ci_v0_logs_dest:
    send_batch_max_size: 500
    send_batch_size: 500
    timeout: 5s
  batch/cw_k8s_ci_v0_metrics_dest:
    send_batch_max_size: 500
    send_batch_size: 500
    timeout: 10s
  filter/cw_k8s_ci_v0_cadvisor_empty:
    error_mode: ignore
    metrics:
      datapoint:
      - attributes["container"] == "" and attributes["pod"] == ""
      - attributes["container"] == "" and attributes["pod"] == nil
      - attributes["container"] == nil and attributes["pod"] == ""
      - attributes["container"] == nil and attributes["pod"] == nil
  filter/cw_k8s_ci_v0_cadvisor_pod:
    error_mode: ignore
    metrics:
      datapoint:
      - attributes["container"] == "POD"
  filter/cw_k8s_ci_v0_cadvisor_rollup:
    error_mode: ignore
    metrics:
      datapoint:
      - (attributes["container"] == nil or attributes["container"] == "") and attributes["pod"]
        != nil and attributes["pod"] != "" and IsMatch(metric.name, "^container_network_")
        != true
  filter/cw_k8s_ci_v0_knative_dataplane_keep:
    error_mode: ignore
    metrics:
      metric:
      - not IsMatch(name, "^(revision_.*request.*|kn_serving_.*)")
  filter/cw_k8s_ci_v0_neuron:
    error_mode: ignore
    metrics:
      metric:
      - IsMatch(name, "^(neuron|execution_|hardware_ecc_)") != true
  filter/cw_k8s_ci_v0_scrape_metadata:
    error_mode: ignore
    metrics:
      metric:
      - IsMatch(name, "^(up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling|scrape_series_added|node_scrape_collector_duration_seconds|node_scrape_collector_success)$")
  filter/cw_k8s_ci_v0_vllm_keep:
    error_mode: ignore
    metrics:
      metric:
      - not IsMatch(name, "^(vllm:|http_).*")
      - IsMatch(name, ".*_created$")
      - type == METRIC_DATA_TYPE_SUMMARY
  groupbyattrs/cw_k8s_ci_v0_cadvisor:
    keys:
    - container
    - pod
    - namespace
  groupbyattrs/cw_k8s_ci_v0_dcgm:
    keys:
    - pod
    - namespace
    - container
  groupbyattrs/cw_k8s_ci_v0_efa:
    keys:
    - k8s.pod.name
    - k8s.namespace.name
    - k8s.container.name
  groupbyattrs/cw_k8s_ci_v0_neuron:
    keys:
    - k8s.pod.name
    - k8s.namespace.name
    - k8s.container.name
    - runtime_tag
  k8sattributes/cw_k8s_ci_v0_node:
    auth_type: serviceAccount
    extract:
      labels:
      - from: node
        key_regex: (.*)
        tag_name: k8s.node.label.$$$1
      metadata:
      - k8s.node.name
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.node.name
  k8sattributes/cw_k8s_ci_v0_pod:
    auth_type: serviceAccount
    extract:
      labels:
      - from: pod
        key_regex: (.*)
        tag_name: k8s.pod.label.$$$1
      metadata:
      - k8s.pod.uid
      - k8s.node.name
      - k8s.deployment.name
      - k8s.statefulset.name
      - k8s.daemonset.name
      - k8s.replicaset.name
      - k8s.job.name
      - k8s.cronjob.name
    filter:
      node_from_env_var: K8S_NODE_NAME
    passthrough: false
    pod_association:
    - sources:
      - from: resource_attribute
        name: k8s.pod.name
      - from: resource_attribute
        name: k8s.namespace.name
  metricstarttime/cw_k8s_ci_v0: {}
  resourcedetection/cw_k8s_ci_v0:
    detectors:
    - eks
    - ec2
    ec2:
      resource_attributes:
        cloud.account.id:
          enabled: true
        cloud.availability_zone:
          enabled: true
        cloud.platform:
          enabled: true
        cloud.provider:
          enabled: true
        cloud.region:
          enabled: true
        host.id:
          enabled: true
        host.image.id:
          enabled: true
        host.name:
          enabled: true
        host.type:
          enabled: true
  transform/cw_k8s_ci_v0_cadvisor_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"]
        != nil and attributes["container"] != ""
      - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"]
        != nil
      - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"]
        != nil
    - context: datapoint
      statements:
      - set(attributes["container"], resource.attributes["container"]) where resource.attributes["container"]
        != nil
      - set(attributes["pod"], resource.attributes["pod"]) where resource.attributes["pod"]
        != nil
      - set(attributes["namespace"], resource.attributes["namespace"]) where resource.attributes["namespace"]
        != nil
    - context: resource
      statements:
      - delete_key(attributes, "container") where attributes["container"] != nil
      - delete_key(attributes, "pod") where attributes["pod"] != nil
      - delete_key(attributes, "namespace") where attributes["namespace"] != nil
  transform/cw_k8s_ci_v0_clear_schema_url:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.schema_url, "")
  transform/cw_k8s_ci_v0_dcgm_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"]
        != nil
      - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"]
        != nil
      - set(attributes["k8s.container.name"], attributes["container"]) where attributes["container"]
        != nil
    - context: datapoint
      statements:
      - set(attributes["pod"], resource.attributes["pod"]) where resource.attributes["pod"]
        != nil
      - set(attributes["namespace"], resource.attributes["namespace"]) where resource.attributes["namespace"]
        != nil
      - set(attributes["container"], resource.attributes["container"]) where resource.attributes["container"]
        != nil
      - delete_key(attributes, "Hostname") where attributes["Hostname"] != nil
      - delete_key(attributes, "pci_bus_id") where attributes["pci_bus_id"] != nil
    - context: resource
      statements:
      - delete_key(attributes, "pod") where attributes["pod"] != nil
      - delete_key(attributes, "namespace") where attributes["namespace"] != nil
      - delete_key(attributes, "container") where attributes["container"] != nil
  transform/cw_k8s_ci_v0_drop_deprecated_semconv:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - delete_key(attributes, "net.host.name") where attributes["net.host.name"]
        != nil
      - delete_key(attributes, "net.host.port") where attributes["net.host.port"]
        != nil
      - delete_key(attributes, "http.scheme") where attributes["http.scheme"] != nil
  transform/cw_k8s_ci_v0_ebs_csi_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["instance_id"], attributes["instance_id"]) where attributes["instance_id"]
        != nil
      - set(resource.attributes["volume_id"], attributes["volume_id"]) where attributes["volume_id"]
        != nil
      - delete_key(attributes, "instance_id") where attributes["instance_id"] != nil
      - delete_key(attributes, "volume_id") where attributes["volume_id"] != nil
  transform/cw_k8s_ci_v0_knative_dataplane_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"]
        != nil
      - set(resource.attributes["k8s.namespace.name"], attributes["namespace"]) where
        attributes["namespace"] != nil
  transform/cw_k8s_ci_v0_knative_dataplane_service_type:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["aws.service.type"], "ai_inference") where attributes["k8s.pod.label.serving.kserve.io/inferenceservice"]
        != nil and attributes["k8s.pod.label.component"] == "predictor"
  transform/cw_k8s_ci_v0_lis_csi_promote:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["instance_id"], attributes["instance_id"]) where attributes["instance_id"]
        != nil
      - set(resource.attributes["volume_id"], attributes["volume_id"]) where attributes["volume_id"]
        != nil
      - delete_key(attributes, "instance_id") where attributes["instance_id"] != nil
      - delete_key(attributes, "volume_id") where attributes["volume_id"] != nil
  transform/cw_k8s_ci_v0_logs_clear_schema_url:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(resource.schema_url, "")
  transform/cw_k8s_ci_v0_logs_labels:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.feature\\.node\\.kubernetes\\.io/")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.beta\\.kubernetes\\.io/")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.failure-domain\\.beta\\.kubernetes\\.io/")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.alpha\\.eksctl\\.io/")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.karpenter\\.k8s\\.aws/instance-cpu")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.karpenter\\.k8s\\.aws/instance-gpu-")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.karpenter\\.k8s\\.aws/instance-accelerator-")
      - delete_matching_keys(attributes, "^k8s\\.node\\.label\\.eks\\.amazonaws\\.com/instance-")
      - delete_key(attributes, "k8s.node.label.topology.kubernetes.io/region")
      - delete_key(attributes, "k8s.node.label.topology.kubernetes.io/zone")
      - delete_key(attributes, "k8s.node.label.topology.ebs.csi.aws.com/zone")
      - delete_key(attributes, "k8s.node.label.node.kubernetes.io/instance-type")
      - delete_key(attributes, "k8s.node.label.kubernetes.io/hostname")
      - delete_key(attributes, "k8s.node.label.helm.sh/chart")
      - delete_key(attributes, "k8s.node.label.release")
      - delete_key(attributes, "k8s.node.label.eks.amazonaws.com/nodegroup-image")
      - delete_key(attributes, "k8s.node.label.k8s.io/cloud-provider-aws")
      - delete_key(attributes, "k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateId")
      - delete_key(attributes, "k8s.node.label.eks.amazonaws.com/sourceLaunchTemplateVersion")
      - delete_key(attributes, "k8s.node.label.karpenter.sh/do-not-sync-taints")
      - delete_key(attributes, "k8s.node.label.karpenter.sh/initialized")
      - delete_key(attributes, "k8s.node.label.karpenter.sh/registered")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-category")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-family")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-generation")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-size")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-memory")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-hypervisor")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-local-nvme")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-ebs-bandwidth")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-network-bandwidth")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-encryption-in-transit-supported")
      - delete_key(attributes, "k8s.node.label.karpenter.k8s.aws/instance-capability-flex")
      - delete_key(attributes, "k8s.pod.label.pod-template-hash")
      - delete_key(attributes, "k8s.pod.label.controller-revision-hash")
      - delete_key(attributes, "k8s.pod.label.pod-template-generation")
      - delete_key(attributes, "k8s.pod.label.topology.kubernetes.io/region")
      - delete_key(attributes, "k8s.pod.label.topology.kubernetes.io/zone")
  transform/cw_k8s_ci_v0_logs_set_cloud_resource_id:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["cloud.resource_id"], Concat(["arn:aws:eks:", attributes["cloud.region"],
        ":", attributes["cloud.account.id"], ":cluster/", attributes["k8s.cluster.name"]],
        "")) where attributes["cloud.region"] != nil and attributes["cloud.account.id"]
        != nil and attributes["k8s.cluster.name"] != nil
  transform/cw_k8s_ci_v0_logs_set_cluster_and_node:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["k8s.cluster.name"], "c")
      - set(attributes["k8s.node.name"], "${env:K8S_NODE_NAME}")
  transform/cw_k8s_ci_v0_logs_set_scope_app:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "application-logs")
  transform/cw_k8s_ci_v0_logs_set_scope_host:
    error_mode: ignore
    log_statements:
    - context: scope
      statements:
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "host-logs")
  transform/cw_k8s_ci_v0_logs_set_workload:
    error_mode: ignore
    log_statements:
    - context: resource
      statements:
      - set(attributes["k8s.workload.name"], attributes["k8s.deployment.name"]) where
        attributes["k8s.deployment.name"] != nil
      - set(attributes["k8s.workload.type"], "Deployment") where attributes["k8s.deployment.name"]
        != nil
      - set(attributes["k8s.workload.name"], attributes["k8s.statefulset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.statefulset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "StatefulSet") where attributes["k8s.statefulset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.daemonset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.daemonset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "DaemonSet") where attributes["k8s.daemonset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.job.name"]) where attributes["k8s.workload.name"]
        == nil and attributes["k8s.job.name"] != nil
      - set(attributes["k8s.workload.type"], "Job") where attributes["k8s.job.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.cronjob.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.cronjob.name"]
        != nil
      - set(attributes["k8s.workload.type"], "CronJob") where attributes["k8s.cronjob.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["k8s.workload.name"], attributes["k8s.replicaset.name"]) where
        attributes["k8s.workload.name"] == nil and attributes["k8s.replicaset.name"]
        != nil
      - set(attributes["k8s.workload.type"], "ReplicaSet") where attributes["k8s.replicaset.name"]
        != nil and attributes["k8s.workload.type"] == nil
      - set(attributes["service.name"], attributes["k8s.workload.name"]) where attributes["service.name"]
        == nil and attributes["k8s.workload.name"] != nil
  transform/cw_k8s_ci_v0_neuron_hw_attrs:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["aws.neuron.device"], attributes["neurondevice"]) where attributes["neurondevice"]
        != nil
      - set(attributes["aws.neuron.core"], attributes["neuroncore"]) where attributes["neuroncore"]
        != nil
      - delete_key(attributes, "neuroncore") where attributes["neuroncore"] != nil
      - delete_key(attributes, "neurondevice") where attributes["neurondevice"] !=
        nil
      - delete_key(attributes, "instance_type") where attributes["instance_type"]
        != nil
  transform/cw_k8s_ci_v0_neuron_promote:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(attributes["aws.neuron.runtime.tag"], attributes["runtime_tag"]) where
        attributes["runtime_tag"] != nil
      - delete_key(attributes, "runtime_tag") where attributes["runtime_tag"] != nil
  transform/cw_k8s_ci_v0_pod_topology:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.attributes["cloud.region"], resource.attributes["k8s.pod.label.topology.kubernetes.io/region"])
        where resource.attributes["cloud.region"] == nil and resource.attributes["k8s.pod.label.topology.kubernetes.io/region"]
        != nil
      - set(resource.attributes["cloud.availability_zone"], resource.attributes["k8s.pod.label.topology.kubernetes.io/zone"])
        where resource.attributes["k8s.pod.label.topology.kubernetes.io/zone"] !=
        nil and not IsMatch(resource.attributes["k8s.pod.label.topology.kubernetes.io/zone"],
        "^[0-9]+$")
  transform/cw_k8s_ci_v0_promote_node_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.node.name"], attributes["node_name"]) where attributes["node_name"]
        != nil
  transform/cw_k8s_ci_v0_set_cloud_resource_id:
    error_mode: ignore
    metric_statements:
    - context: resource
      statements:
      - set(resource.attributes["cloud.resource_id"], Concat(["arn:aws:eks:", resource.attributes["cloud.region"],
        ":", resource.attributes["cloud.account.id"], ":cluster/", resource.attributes["k8s.cluster.name"]],
        "")) where resource.attributes["cloud.region"] != nil and resource.attributes["cloud.account.id"]
        != nil and resource.attributes["k8s.cluster.name"] != nil
  transform/cw_k8s_ci_v0_set_cluster_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(resource.attributes["k8s.cluster.name"], "c")
  transform/cw_k8s_ci_v0_set_node_name:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["node_name"], "${env:K8S_NODE_NAME}")
  transform/cw_k8s_ci_v0_set_scope_cadvisor:
    error_mode: ignore
    metric_statements:
    - context: scope
      statements:
      - set(scope.name, "github.com/google/cadvisor")
      - set(scope.schema_url, "")
      - set(attributes["cloudwatch.source"], "cloudwatch-agent")
      - set(attributes["cloudwatch.solution"], "k8s-otel-container-insights")
      - set(attributes["cloudwatch.pipeline"], "cadvisor")
  transform/cw_k8s_ci_v0_set_scope_dcgm:
    error_mode: ignore
    metric_statements:
    - context: scope
