#     --namespace amazon-cloudwatch -f ci.yaml
#
# ci.yaml:
#   clusterName: c
#   region: us-west-2
#   otelContainerInsights:
#     enabled: true
#     solutions:
#       karpenter: {enabled: true}
#       keda: {enabled: true}
#
# The processors section of spec.otelConfig of the AmazonCloudWatchAgent cloudwatch-agent-cluster-scraper, unchanged.
processors:
